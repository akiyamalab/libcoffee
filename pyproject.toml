[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "libcoffee"
dynamic = ["version"]
description = "A library for compound filtering via fragment-based efficient evaluation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Keisuke Yanagisawa", email = "yanagisawa@comp.isct.ac.jp" }]
requires-python = ">=3.11"
dependencies = ["openbabel-wheel", "rdkit>=2024.3.1", "numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
dev = ["pytest", "mypy", "isort", "rdkit-stubs"]

[project.urls]
Homepage = "https://github.com/akiyamalab/libcoffee"

[tool.setuptools.dynamic]
version = { attr = "libcoffee.__version__" }

[tool.setuptools.packages.find]
include = ["libcoffee*"]

[tool.setuptools.package-data]
"libcoffee.docking.docking.restretto" = ["atomgrid-gen", "conformer-docking"]
"libcoffee.fragment.decompose" = ["decompose"]
